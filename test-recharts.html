<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recharts Test</title>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PropTypes (required by Recharts) -->
  <script crossorigin src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>

  <!-- Recharts -->
  <script crossorigin src="https://unpkg.com/recharts@2.10.3/dist/Recharts.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: #f9fafb;
    }

    #root {
      width: 100%;
      min-height: 100vh;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Check if Recharts loaded
    console.log('Window.Recharts:', window.Recharts);
    console.log('Recharts keys:', window.Recharts ? Object.keys(window.Recharts) : 'NOT LOADED');

    // Make recharts available
    if (!window.Recharts) {
      console.error('❌ Recharts library failed to load!');
      document.getElementById('root').innerHTML = '<div style="padding: 20px; color: red;">ERROR: Recharts failed to load!</div>';
    }

    const {
      BarChart, LineChart, AreaChart, PieChart,
      Bar, Line, Area, Pie, XAxis, YAxis, CartesianGrid,
      Tooltip, Legend, ResponsiveContainer, Cell
    } = window.Recharts || {};

    // Generate mock data
    const generateLineChartData = function(count = 12) {
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return Array.from({ length: count }, (_, i) => ({
        name: months[i % 12],
        value: Math.floor(Math.random() * 5000) + 1000,
        revenue: Math.floor(Math.random() * 8000) + 2000,
        profit: Math.floor(Math.random() * 3000) + 500,
      }));
    };

    const TestDashboard = () => {
      const data = generateLineChartData(12);

      console.log('Generated data:', data);
      console.log('ResponsiveContainer:', ResponsiveContainer);
      console.log('LineChart:', LineChart);

      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-50 to-blue-50/30 p-8">
          <h1 className="text-4xl font-bold mb-8">Recharts Test Dashboard</h1>

          <div className="bg-white rounded-2xl p-6 shadow-xl">
            <h3 className="text-2xl font-bold mb-4">Revenue Trends</h3>
            <ResponsiveContainer width="100%" height={300}>
              <LineChart data={data}>
                <CartesianGrid strokeDasharray="3 3" stroke="#e5e7eb" />
                <XAxis dataKey="name" stroke="#6b7280" />
                <YAxis stroke="#6b7280" />
                <Tooltip contentStyle={{ backgroundColor: '#1f2937', border: 'none', borderRadius: '8px' }} />
                <Legend />
                <Line type="monotone" dataKey="revenue" stroke="#3b82f6" strokeWidth={2} />
                <Line type="monotone" dataKey="profit" stroke="#10b981" strokeWidth={2} />
              </LineChart>
            </ResponsiveContainer>
          </div>
        </div>
      );
    };

    // Render
    const rootElement = document.getElementById('root');
    ReactDOM.render(<TestDashboard />, rootElement);
  </script>
</body>
</html>
